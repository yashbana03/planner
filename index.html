<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDS Journey Planner - Cross Sync</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #eff6ff;
            --accent: #f59e0b;
            --text: #1f2937;
            --bg: #e5e7eb;
            --card-bg: #ffffff;
            --border: #d1d5db;
            --success: #10b981;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.5px; }
        header p { margin: 5px 0 0; opacity: 0.9; font-size: 0.9rem; }
        
        /* 🔄 MULTI-DEVICE SYNC JUGAD UI */
        .sync-panel {
            background: #fff7ed;
            border: 2px dashed #f97316;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .sync-panel h4 { margin: 0 0 10px 0; color: #ea580c; font-size: 1.1rem; }
        .sync-btn {
            background-color: #f97316;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .sync-btn:hover { background-color: #ea580c; }
        .sync-btn.import-btn { background-color: #2563eb; }
        .sync-btn.import-btn:hover { background-color: #1d4ed8; }

        .selector-box {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .selector-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            flex-wrap: wrap;
        }
        .selector-box label {
            font-weight: bold;
            color: var(--primary);
            font-size: 1rem;
        }
        .selector-box select {
            padding: 8px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid var(--border);
            outline: none;
            cursor: pointer;
            font-weight: 600;
            color: var(--text);
        }
        .nav-btn-container {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .nav-btn:disabled { background-color: #9ca3af; cursor: not-allowed; opacity: 0.6; }

        .todays-dashboard-box {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border: 3px solid var(--success);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .todays-dashboard-box h3 {
            margin: 0 0 15px 0;
            color: #065f46;
            font-size: 1.3rem;
            border-bottom: 2px solid #a7f3d0;
            padding-bottom: 8px;
        }
        .todays-task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
        }
        .todays-task-item {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 5px solid var(--success);
            display: flex;
            align-items: flex-start;
            font-weight: 500;
        }
        .todays-task-item input[type="checkbox"] { margin-right: 10px; width: 16px; height: 16px; accent-color: var(--success); }

        .pdf-page-block {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 40px;
            display: none;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .page-title { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        .pdf-tag { background: #3b82f6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }

        .page-daily-work { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 10px; padding: 15px 20px; margin-bottom: 25px; }
        .page-daily-work h4 { margin: 0 0 15px 0; color: #b45309; font-size: 1rem; text-transform: uppercase;}
        
        .ticker-table { width: 100%; border-collapse: collapse; }
        .ticker-row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px dashed #fef3c7; }
        .task-label { flex: 2; font-weight: 600; font-size: 0.9rem; }
        .checkbox-group { flex: 3; display: flex; justify-content: space-between; max-width: 500px; }
        .ticker-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .ticker-cell span { font-size: 0.7rem; color: #b45309; font-weight: bold; }
        .ticker-cell input[type="checkbox"] { width: 16px; height: 16px; accent-color: #b45309; }

        .tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .day-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
        .day-box.sunday { background: #fef2f2; border-color: #fee2e2; }
        .day-box h5 { margin: 0 0 10px 0; font-size: 1.05rem; color: var(--primary); border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; }
        .day-box.today-highlight { border: 2.5px solid #10b981 !important; background: #f0fdf4 !important; }

        .task-list { list-style: none; padding: 0; margin: 0; }
        .task-item { display: flex; align-items: flex-start; margin-bottom: 8px; font-size: 0.88rem; }
        .task-item input[type="checkbox"] { margin-right: 8px; width: 14px; height: 14px; accent-color: var(--primary); }
        .task-text { flex: 1; }
        .completed .task-text { text-decoration: line-through; color: #9ca3af; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CDS JOURNEY PLANNER</h1>
        <p>1-Click Fast Device Sync Edition</p>
    </header>

    <!-- 🔄 DEVICE SYNC DASHBOARD -->
    <div class="sync-panel">
        <h4>📱 Laptop ⇆ Phone Data Transfer</h4>
        <button class="sync-btn" id="export-btn">📤 Step 1: Copy Sync Code (From Laptop)</button>
        <button class="sync-btn import-btn" id="import-btn">📥 Step 2: Paste Sync Code (On Phone)</button>
    </div>

    <div class="selector-box">
        <div class="selector-controls">
            <label for="block-select">🎯 Select Study Block:</label>
            <select id="block-select"></select>
        </div>
        <div class="nav-btn-container">
            <button id="prev-btn" class="nav-btn">◀ Previous Block</button>
            <button id="next-btn" class="nav-btn">Next Block ▶</button>
        </div>
    </div>

    <div class="todays-dashboard-box">
        <h3 id="todays-dashboard-title">🎯 TODAY'S FOCUS TASKS</h3>
        <ul class="todays-task-list" id="todays-task-container"></ul>
    </div>

    <div id="pdf-layout-container"></div>
</div>

<script>
    const dailyEssentials = ["BOOK READING", "30 MIN CURRENT AFFAIRS REVISION", "KHELGHAR QUIZ", "NEWSPAPER", "DRR", "DIARY WRITING"];
    const scheduleData = [
        { date: "25 MAY", tasks: ["President + VP + Governor", "January smiling buddha Revision", "Tense", "Idioms & phrases", "Watch root words class"] },
        { date: "26 MAY", tasks: ["Parliament", "January smiling buddha Revision", "Tense", "S1-S6 practice"] },
        { date: "27 MAY", tasks: ["Parliament + Parliamentary committees", "Jan.smiling buddha Revision", "Tense based error practice", "S1-S6 practice", "Watch Jan CA class"] },
        { date: "28 MAY", tasks: ["PM + CM + President", "Previous year error practice", "Parts of speech practice", "PQRS practice", "Idioms & phrases"] },
        { date: "29 MAY", tasks: ["Cell", "Feb smiling buddha Revision", "Noun", "S1-S2 practice", "Watch BAD class 2"] },
        { date: "30 MAY", tasks: ["Tissue", "Feb smiling buddha Revision", "Noun practice", "New pattern parts of speech"] },
        { date: "31 MAY", isSunday: true, tasks: ["Polity Revision", "Backlogs", "Watch Jan CA class"] },
        { date: "1 JUNE", tasks: ["Life processes", "February smiling buddha Revision", "Watch Feb CA class"] },
        { date: "2 JUNE", tasks: ["Life processes", "March smiling buddha Revision", "Homonyms Revision", "S1-S6 practice"] },
        { date: "3 JUNE", tasks: ["Revise all polity topics covered so far", "March smiling buddha Revision", "Watch 11 most Asked Homonyms"] },
        { date: "4 JUNE", tasks: ["State legislature + panchayat + municipalities", "April smiling buddha Revision", "Pronoun", "Practice new pattern POS", "Fill ups practice", "PQRS practice", "Watch march CA class"] },
        { date: "5 JUNE", tasks: ["Constitutional & non-constitutional bodies", "April smiling buddha Revision", "Verb", "Pronoun practice", "Homonyms Revision", "Watch vocab class", "S1-S2 practice"] },
        { date: "6 JUNE", tasks: ["Revise cell and tissue", "Solve any previous year english paper", "April smiling buddha Revision"] },
        { date: "7 JUNE", isSunday: true, tasks: ["Revise all Biology Topic covered", "Cloze test practice"] },
        { date: "8 JUNE", tasks: ["Disease", "January smiling buddha Revision", "Verb"] },
        { date: "9 JUNE", tasks: ["Plants & Human hormones", "Jan smiling buddha Revision", "Idioms & phrases"] },
        { date: "10 JUNE", tasks: ["Reproduction", "Jan smiling buddha Revision", "Verb practice", "Fill ups", "Homonyms Revision"] },
        { date: "11 JUNE", tasks: ["Revise polity topics covered so far", "Feb smiling buddha Revision"] },
        { date: "12 JUNE", tasks: ["Fundamental Rights", "Feb smiling buddha Revision", "Subject verb Agreement", "Idioms & phrases Revision"] },
        { date: "13 JUNE", tasks: ["DRSP + FDs", "Feb smiling buddha Revision", "Solve any previous year english question paper"] },
        { date: "14 JUNE", isSunday: true, tasks: ["Revise Biology topics covered so far"] },
        { date: "15 JUNE", tasks: ["Diversity in living organisms", "Feb smiling buddha Revision", "Discourse marker", "Cloze test practice", "Watch BAD series class 3", "Error practice"] },
        { date: "16 JUNE", tasks: ["Control & coordination + formed elements + blood", "March smiling buddha Revision", "Question tag", "PQRS practice", "Idioms & phrases Revision"] },
        { date: "17 JUNE", tasks: ["Heredity & evolution", "March smiling buddha Revision", "Question tag practice", "Discourse marker", "Watch May May CA class"] }
    ];

    const todayFormatted = "6 JUNE"; 
    let detectedBlockId = "block-2"; 
    let todaysTasksArray = ["Revise cell and tissue", "Solve any previous year english paper", "April smiling buddha Revision"];
    let todaysDateStringSafe = "6_JUNE";

    const container = document.getElementById('pdf-layout-container');
    const selectMenu = document.getElementById('block-select');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const itemsPerGroup = 8;
    const totalBlocks = Math.ceil(scheduleData.length / itemsPerGroup);

    for(let b = 1; b <= totalBlocks; b++) {
        const option = document.createElement('option');
        option.value = `block-${b}`;
        option.textContent = `Block Group ${b} (Day ${(b-1)*8 + 1} to ${Math.min(b*8, scheduleData.length)})`;
        selectMenu.appendChild(option);
    }

    for (let i = 0; i < scheduleData.length; i += itemsPerGroup) {
        const currentGroup = scheduleData.slice(i, i + itemsPerGroup);
        const groupIndex = Math.floor(i / itemsPerGroup) + 1;
        const startDayCount = i + 1;

        const pageBlock = document.createElement('div');
        pageBlock.className = 'pdf-page-block';
        pageBlock.id = `block-${groupIndex}`;

        let pageHeaderHtml = `<div class="page-header"><div class="page-title">📅 STUDY SCHEDULE PLANNER</div><div class="pdf-tag">GROUP BLOCK ${groupIndex}</div></div>`;
        let dailyWorkHtml = `<div class="page-daily-work"><h4>☑ DAILY WORK</h4><div class="ticker-table">`;

        dailyEssentials.forEach((essential, essentialIdx) => {
            dailyWorkHtml += `<div class="ticker-row"><div class="task-label">⚡ ${essential}</div><div class="checkbox-group">`;
            for (let t = 0; t < 8; t++) {
                const absoluteDay = startDayCount + t;
                if(absoluteDay <= scheduleData.length) {
                    const storageKey = `daily_g${groupIndex}_e${essentialIdx}_d${absoluteDay}`;
                    const isChecked = localStorage.getItem(storageKey) === 'true';
                    dailyWorkHtml += `<div class="ticker-cell"><span>D${absoluteDay}</span><input type="checkbox" class="sync-checkbox" data-key="${storageKey}" ${isChecked ? 'checked' : ''}></div>`;
                }
            }
            dailyWorkHtml += `</div></div>`;
        });
        dailyWorkHtml += `</div></div>`;

        let gridHtml = `<div class="tasks-grid">`;
        currentGroup.forEach((day, dayIndex) => {
            const absoluteDayNumber = startDayCount + dayIndex;
            const safeDateStr = day.date.replace(/\s+/g, '_');
            const isToday = (day.date === todayFormatted);
            const isSundayClass = day.isSunday ? 'sunday' : '';
            const isTodayClass = isToday ? 'today-highlight' : '';

            gridHtml += `<div class="day-box ${isSundayClass} ${isTodayClass}"><h5>[D${absoluteDayNumber}] ${day.date}</h5><ul class="task-list">`;
            day.tasks.forEach((task, taskIdx) => {
                const storageKey = `task_${safeDateStr}_${taskIdx}`;
                const isChecked = localStorage.getItem(storageKey) === 'true';
                gridHtml += `<li class="task-item ${isChecked ? 'completed' : ''}" id="main-item-${safeDateStr}-${taskIdx}"><input type="checkbox" class="sync-checkbox" data-main-id="${safeDateStr}-${taskIdx}" data-key="${storageKey}" ${isChecked ? 'checked' : ''}><span class="task-text">${task}</span></li>`;
            });
            gridHtml += `</ul></div>`;
        });
        gridHtml += `</div>`;
        pageBlock.innerHTML = pageHeaderHtml + dailyWorkHtml + gridHtml;
        container.appendChild(pageBlock);
    }

    const dashboardContainer = document.getElementById('todays-task-container');
    todaysTasksArray.forEach((task, taskIdx) => {
        const storageKey = `task_${todaysDateStringSafe}_${taskIdx}`;
        const isChecked = localStorage.getItem(storageKey) === 'true';
        dashboardContainer.innerHTML += `<li class="todays-task-item ${isChecked ? 'completed' : ''}" id="dash-item-${todaysDateStringSafe}-${taskIdx}"><input type="checkbox" class="sync-checkbox" data-dash-id="${todaysDateStringSafe}-${taskIdx}" data-key="${storageKey}" ${isChecked ? 'checked' : ''}><span class="task-text">${task}</span></li>`;
    });

    function showBlock(blockId) {
        document.querySelectorAll('.pdf-page-block').forEach(b => b.style.display = 'none');
        document.getElementById(blockId).style.display = 'block';
        selectMenu.value = blockId;
    }
    selectMenu.addEventListener('change', function() { showBlock(this.value); });

    document.querySelectorAll('.sync-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            const key = this.getAttribute('data-key');
            if(key) localStorage.setItem(key, this.checked);
            const item = this.parentElement;
            if(this.checked) item.classList.add('completed'); else item.classList.remove('completed');
        });
    });

    // 📤 EXPORT CODE LOGIC
    document.getElementById('export-btn').addEventListener('click', () => {
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('task_') || key.startsWith('daily_')) {
                data[key] = localStorage.getItem(key);
            }
        }
        const token = btoa(JSON.stringify(data));
        navigator.clipboard.writeText(token);
        alert("🚀 Sync Code Copy Ho Gaya Hai! Ise WhatsApp par khudko bhejo aur phone par paste kar lo.");
    });

    // 📥 IMPORT CODE LOGIC
    document.getElementById('import-btn').addEventListener('click', () => {
        const code = prompt("WhatsApp se copy kiya hua Sync Code yahan paste karein:");
        if (!code) return;
        try {
            const data = JSON.parse(atob(code.trim()));
            Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
            alert("🎯 Data Loaded Successfully! Page refresh ho raha hai...");
            window.location.reload();
        } catch(e) {
            alert("❌ Invalid Code! Kripya sahi se copy karein.");
        }
    });

    window.addEventListener('DOMContentLoaded', () => { showBlock(detectedBlockId); });
</script>
</body>
</html>
